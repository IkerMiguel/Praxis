services:
  db:
    image: postgres:16-alpine
    container_name: praxis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-praxis}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-praxis}
      POSTGRES_DB: ${DATABASE_NAME:-praxis}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-praxis} -d ${DATABASE_NAME:-praxis}"]
      interval: 5s
      timeout: 5s
      retries: 10

